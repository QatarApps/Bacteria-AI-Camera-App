<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bacteria AI - Classifier & Camera</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-dark: #0f172a;
      --card-bg: #1e293b;
      --card-border: #334155;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --danger: #ef4444;
      --success: #22c55e;
      --accent: #3b82f6;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--text-main);
      font-family: 'Inter', -apple-system, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      background-color: rgba(30, 41, 59, 0.8);
      backdrop-filter: blur(8px);
      border-bottom: 1px solid var(--card-border);
      padding: 1rem 2rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .logo-group {
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }

    .badge-prototype {
      background: #475569;
      color: #e2e8f0;
      font-size: 0.75rem;
      padding: 0.2rem 0.6rem;
      border-radius: 9999px;
      text-transform: uppercase;
      font-weight: 600;
    }

    main {
      flex: 1;
      max-width: 1300px;
      width: 100%;
      margin: 0 auto;
      padding: 2rem;
      display: grid;
      grid-template-columns: 1.2fr 0.8fr;
      gap: 2rem;
    }

    @media (max-width: 900px) {
      main {
        grid-template-columns: 1fr;
      }
    }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 1.5rem;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
    }

    .video-container {
      position: relative;
      width: 100%;
      aspect-ratio: 4/3;
      background: #020617;
      border-radius: 8px;
      overflow: hidden;
      border: 3px solid #475569;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: border-color 0.2s ease;
    }

    .video-container.status-red {
      border-color: var(--danger);
      box-shadow: 0 0 20px rgba(239, 68, 68, 0.4);
    }

    .video-container.status-green {
      border-color: var(--success);
      box-shadow: 0 0 20px rgba(34, 197, 94, 0.4);
    }

    video, #capturedCanvas {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .controls-bar {
      margin-top: 1rem;
      display: flex;
      flex-wrap: wrap;
      gap: 0.75rem;
      align-items: center;
    }

    button, .file-btn {
      background: var(--accent);
      color: white;
      border: none;
      padding: 0.6rem 1.2rem;
      border-radius: 6px;
      font-weight: 600;
      cursor: pointer;
      font-size: 0.9rem;
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      transition: background 0.2s;
    }

    button:hover, .file-btn:hover {
      background: #2563eb;
    }

    button.btn-danger {
      background: var(--danger);
    }
    button.btn-danger:hover {
      background: #dc2626;
    }

    select {
      background: #334155;
      color: white;
      border: 1px solid var(--card-border);
      padding: 0.6rem 1rem;
      border-radius: 6px;
      font-size: 0.9rem;
    }

    .banner-result {
      padding: 1rem;
      border-radius: 8px;
      margin-bottom: 1.5rem;
      text-align: center;
      transition: all 0.3s ease;
      background: #334155;
    }

    .banner-result.alert-red {
      background: rgba(239, 68, 68, 0.15);
      border: 1px solid var(--danger);
      color: #fca5a5;
    }

    .banner-result.alert-green {
      background: rgba(34, 197, 94, 0.15);
      border: 1px solid var(--success);
      color: #86efac;
    }

    .badge-status {
      display: inline-block;
      font-size: 0.8rem;
      font-weight: 700;
      letter-spacing: 0.05em;
      padding: 0.25rem 0.75rem;
      border-radius: 4px;
      margin-bottom: 0.5rem;
    }

    .alert-red .badge-status {
      background: var(--danger);
      color: white;
    }

    .alert-green .badge-status {
      background: var(--success);
      color: white;
    }

    .prediction-title {
      font-size: 1.4rem;
      font-weight: 700;
      font-family: 'JetBrains Mono', monospace;
    }

    .confidence-tag {
      font-size: 1.1rem;
      font-weight: 500;
      margin-top: 0.25rem;
    }

    .scores-list {
      margin-top: 1rem;
      display: flex;
      flex-direction: column;
      gap: 0.8rem;
    }

    .score-row {
      display: flex;
      flex-direction: column;
      gap: 0.25rem;
    }

    .score-labels {
      display: flex;
      justify-content: space-between;
      font-size: 0.85rem;
      font-family: 'JetBrains Mono', monospace;
    }

    .progress-bar-bg {
      background: #334155;
      height: 8px;
      border-radius: 4px;
      overflow: hidden;
    }

    .progress-bar-fill {
      height: 100%;
      background: var(--accent);
      border-radius: 4px;
      transition: width 0.2s ease;
    }

    .progress-bar-fill.target {
      background: var(--danger);
    }

    .legend-box {
      margin-top: 1.5rem;
      padding: 1rem;
      background: #0f172a;
      border-radius: 8px;
      font-size: 0.85rem;
      border: 1px solid #1e293b;
    }

    .legend-item {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      margin-bottom: 0.35rem;
    }

    .dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
    }
    .dot-red { background: var(--danger); }
    .dot-green { background: var(--success); }

    .fps-badge {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.8rem;
      color: var(--text-muted);
    }
  </style>
</head>
<body>

<header>
  <div class="logo-group">
    <h2>🔬 Bacteria AI Classifier</h2>
    <span class="badge-prototype">Docker Edition</span>
  </div>
  <div class="fps-badge" id="fpsDisplay">Status: Idle</div>
</header>

<main>
  <!-- Left Column: Camera / Live Video -->
  <section class="card">
    <div class="video-container" id="videoBox">
      <video id="webcam" autoplay playsinline muted></video>
      <canvas id="capturedCanvas" style="display: none;"></canvas>
    </div>

    <div class="controls-bar">
      <button id="startBtn">▶ Start Camera</button>
      <button id="stopBtn" class="btn-danger" style="display:none;">⏹ Stop Camera</button>

      <select id="cameraSelect" title="Select Video Input">
        <option value="">Default Camera / Microscope</option>
      </select>

      <label class="file-btn" style="cursor: pointer;">
        📁 Upload Image
        <input type="file" id="fileInput" accept="image/*" style="display: none;">
      </label>
    </div>
  </section>

  <!-- Right Column: Classification Results -->
  <section class="card">
    <div class="banner-result" id="banner">
      <span class="badge-status" id="badgeStatus">READY</span>
      <div class="prediction-title" id="predLabel">Awaiting Input...</div>
      <div class="confidence-tag" id="predConf">0.0%</div>
    </div>

    <h3 style="font-size: 1rem; margin-bottom: 0.75rem;">Class Probability Breakdown</h3>
    <div class="scores-list" id="scoresContainer">
      {% for label in labels %}
      <div class="score-row">
        <div class="score-labels">
          <span>{{ label }}</span>
          <span id="score-val-{{ loop.index0 }}">0%</span>
        </div>
        <div class="progress-bar-bg">
          <div class="progress-bar-fill {% if label in targets %}target{% endif %}" id="score-bar-{{ loop.index0 }}" style="width: 0%;"></div>
        </div>
      </div>
      {% endfor %}
    </div>

    <div class="legend-box">
      <strong>Alert Rules:</strong>
      <div class="legend-item" style="margin-top: 0.5rem;">
        <span class="dot dot-red"></span>
        <span><b>RED</b> = Target Pathogen (<em>P. aeruginosa, S. aureus</em>)</span>
      </div>
      <div class="legend-item">
        <span class="dot dot-green"></span>
        <span><b>GREEN</b> = Negative / Comparator species</span>
      </div>
    </div>
  </section>
</main>

<script>
  const video = document.getElementById('webcam');
  const canvas = document.getElementById('capturedCanvas');
  const videoBox = document.getElementById('videoBox');
  const startBtn = document.getElementById('startBtn');
  const stopBtn = document.getElementById('stopBtn');
  const cameraSelect = document.getElementById('cameraSelect');
  const fileInput = document.getElementById('fileInput');
  const banner = document.getElementById('banner');
  const badgeStatus = document.getElementById('badgeStatus');
  const predLabel = document.getElementById('predLabel');
  const predConf = document.getElementById('predConf');
  const fpsDisplay = document.getElementById('fpsDisplay');

  let stream = null;
  let inferenceInterval = null;
  let isPredicting = false;
  let lastFrameTime = performance.now();

  const labels = {{ labels | tojson }};
  const targets = new Set({{ targets | tojson }});

  // Enumerate cameras
  async function loadCameras() {
    try {
      const devices = await navigator.mediaDevices.enumerateDevices();
      const videoDevices = devices.filter(d => d.kind === 'videoinput');
      cameraSelect.innerHTML = '';
      videoDevices.forEach((dev, i) => {
        const opt = document.createElement('option');
        opt.value = dev.deviceId;
        opt.text = dev.label || `Camera ${i + 1}`;
        cameraSelect.appendChild(opt);
      });
    } catch (e) {
      console.warn("Could not list cameras:", e);
    }
  }

  startBtn.addEventListener('click', async () => {
    try {
      const constraints = {
        video: cameraSelect.value ? { deviceId: { exact: cameraSelect.value } } : true
      };
      stream = await navigator.mediaDevices.getUserMedia(constraints);
      video.srcObject = stream;
      video.style.display = 'block';
      canvas.style.display = 'none';

      startBtn.style.display = 'none';
      stopBtn.style.display = 'inline-flex';
      fpsDisplay.textContent = 'Live Inference: Active';

      await loadCameras();

      // Inference loop every 200ms (~5 FPS)
      inferenceInterval = setInterval(captureAndPredict, 200);
    } catch (err) {
      alert("Unable to access camera: " + err.message);
    }
  });

  stopBtn.addEventListener('click', () => {
    if (stream) {
      stream.getTracks().forEach(t => t.stop());
    }
    if (inferenceInterval) {
      clearInterval(inferenceInterval);
    }
    video.srcObject = null;
    startBtn.style.display = 'inline-flex';
    stopBtn.style.display = 'none';
    fpsDisplay.textContent = 'Status: Stopped';
  });

  async function captureAndPredict() {
    if (isPredicting || !video.videoWidth) return;
    isPredicting = true;

    try {
      canvas.width = video.videoWidth;
      canvas.height = video.videoHeight;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

      const base64Img = canvas.toDataURL('image/jpeg', 0.8);
      const res = await fetch('/predict', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ image: base64Img })
      });

      const data = await res.json();
      if (!data.error) {
        updateUI(data);
      }
    } catch (e) {
      console.error(e);
    } finally {
      isPredicting = false;
    }
  }

  fileInput.addEventListener('change', async (e) => {
    const file = e.target.files[0];
    if (!file) return;

    if (stream) {
      stopBtn.click();
    }

    const reader = new FileReader();
    reader.onload = async (event) => {
      const img = new Image();
      img.onload = async () => {
        canvas.width = img.width;
        canvas.height = img.height;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0);

        video.style.display = 'none';
        canvas.style.display = 'block';

        const base64Img = canvas.toDataURL('image/jpeg', 0.9);
        const res = await fetch('/predict', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ image: base64Img })
        });
        const data = await res.json();
        if (!data.error) {
          updateUI(data);
          fpsDisplay.textContent = 'Image Upload Inference Complete';
        }
      };
      img.src = event.target.result;
    };
    reader.readAsDataURL(file);
  });

  function updateUI(data) {
    predLabel.textContent = data.label;
    predConf.textContent = data.confidence.toFixed(1) + '%';
    badgeStatus.textContent = data.status;

    videoBox.className = 'video-container ' + (data.is_target ? 'status-red' : 'status-green');
    banner.className = 'banner-result ' + (data.is_target ? 'alert-red' : 'alert-green');

    // Update all scores
    labels.forEach((label, idx) => {
      const val = data.all_scores[label] || 0;
      const valEl = document.getElementById(`score-val-${idx}`);
      const barEl = document.getElementById(`score-bar-${idx}`);
      if (valEl) valEl.textContent = val.toFixed(1) + '%';
      if (barEl) barEl.style.width = Math.min(100, Math.max(0, val)) + '%';
    });
  }

  // Load cameras on start
  if (navigator.mediaDevices) {
    loadCameras();
  }
</script>
</body>
</html>
