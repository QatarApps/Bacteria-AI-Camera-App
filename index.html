<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bacteria AI - Real-time Classifier</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
  <!-- ONNX Runtime Web v1.16.3 with local bundling and CDN fallback -->
  <script src="./ort.min.js"></script>
  <script>
    if (typeof ort === 'undefined') {
      document.write('<script src="https://cdn.jsdelivr.net/npm/onnxruntime-web@1.16.3/dist/ort.min.js"><\/script>');
    }
  </script>
  <style>
    :root {
      --bg-dark: #090d16;
      --card-bg: #131d2e;
      --card-border: #1e293b;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --danger: #ef4444;
      --success: #22c55e;
      --accent: #3b82f6;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--text-main);
      font-family: 'Inter', -apple-system, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      background-color: rgba(19, 29, 46, 0.9);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--card-border);
      padding: 1rem 2rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .logo-group {
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }

    .badge-live {
      background: #2563eb;
      color: white;
      font-size: 0.75rem;
      padding: 0.2rem 0.65rem;
      border-radius: 9999px;
      text-transform: uppercase;
      font-weight: 700;
      letter-spacing: 0.05em;
    }

    main {
      flex: 1;
      max-width: 1250px;
      width: 100%;
      margin: 0 auto;
      padding: 2rem;
      display: grid;
      grid-template-columns: 1.2fr 0.8fr;
      gap: 2rem;
    }

    @media (max-width: 900px) {
      main {
        grid-template-columns: 1fr;
        padding: 1rem;
      }
    }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 1.5rem;
      box-shadow: 0 12px 30px -5px rgba(0, 0, 0, 0.5);
    }

    .video-container {
      position: relative;
      width: 100%;
      aspect-ratio: 4/3;
      background: #020617;
      border-radius: 10px;
      overflow: hidden;
      border: 3px solid #334155;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.25s ease;
    }

    .video-container.status-red {
      border-color: var(--danger);
      box-shadow: 0 0 25px rgba(239, 68, 68, 0.5);
    }

    .video-container.status-green {
      border-color: var(--success);
      box-shadow: 0 0 25px rgba(34, 197, 94, 0.5);
    }

    video, #capturedCanvas {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .controls-bar {
      margin-top: 1rem;
      display: flex;
      flex-wrap: wrap;
      gap: 0.75rem;
      align-items: center;
    }

    button, .file-btn {
      background: var(--accent);
      color: white;
      border: none;
      padding: 0.65rem 1.2rem;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
      font-size: 0.9rem;
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      transition: all 0.2s;
    }

    button:hover, .file-btn:hover {
      background: #2563eb;
    }

    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    button.btn-danger {
      background: var(--danger);
    }
    button.btn-danger:hover {
      background: #dc2626;
    }

    select {
      background: #1e293b;
      color: white;
      border: 1px solid var(--card-border);
      padding: 0.65rem 1rem;
      border-radius: 8px;
      font-size: 0.9rem;
    }

    .banner-result {
      padding: 1.25rem;
      border-radius: 10px;
      margin-bottom: 1.5rem;
      text-align: center;
      transition: all 0.3s ease;
      background: #1e293b;
    }

    .banner-result.alert-red {
      background: rgba(239, 68, 68, 0.15);
      border: 1px solid var(--danger);
      color: #fca5a5;
    }

    .banner-result.alert-green {
      background: rgba(34, 197, 94, 0.15);
      border: 1px solid var(--success);
      color: #86efac;
    }

    .badge-status {
      display: inline-block;
      font-size: 0.8rem;
      font-weight: 800;
      letter-spacing: 0.06em;
      padding: 0.3rem 0.8rem;
      border-radius: 6px;
      margin-bottom: 0.5rem;
    }

    .alert-red .badge-status {
      background: var(--danger);
      color: white;
    }

    .alert-green .badge-status {
      background: var(--success);
      color: white;
    }

    .prediction-title {
      font-size: 1.35rem;
      font-weight: 700;
      font-family: 'JetBrains Mono', monospace;
    }

    .confidence-tag {
      font-size: 1.15rem;
      font-weight: 600;
      margin-top: 0.3rem;
    }

    .scores-list {
      margin-top: 1rem;
      display: flex;
      flex-direction: column;
      gap: 0.85rem;
    }

    .score-row {
      display: flex;
      flex-direction: column;
      gap: 0.3rem;
    }

    .score-labels {
      display: flex;
      justify-content: space-between;
      font-size: 0.85rem;
      font-family: 'JetBrains Mono', monospace;
    }

    .progress-bar-bg {
      background: #1e293b;
      height: 8px;
      border-radius: 4px;
      overflow: hidden;
    }

    .progress-bar-fill {
      height: 100%;
      background: var(--accent);
      border-radius: 4px;
      transition: width 0.15s ease;
    }

    .progress-bar-fill.target {
      background: var(--danger);
    }

    .legend-box {
      margin-top: 1.5rem;
      padding: 1rem;
      background: #090d16;
      border-radius: 8px;
      font-size: 0.85rem;
      border: 1px solid #1e293b;
    }

    .legend-item {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      margin-top: 0.4rem;
    }

    .dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
    }
    .dot-red { background: var(--danger); }
    .dot-green { background: var(--success); }

    .engine-badge {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.8rem;
      color: var(--text-muted);
    }
  </style>
</head>
<body>

<header>
  <div class="logo-group">
    <h2>🔬 Bacteria AI Classifier</h2>
    <span class="badge-live">In-Browser Edge AI</span>
  </div>
  <div class="engine-badge" id="engineStatus">Loading AI Model...</div>
</header>

<main>
  <!-- Camera Feed / Input Section -->
  <section class="card">
    <div class="video-container" id="videoBox">
      <video id="webcam" autoplay playsinline muted></video>
      <canvas id="capturedCanvas" style="display: none;"></canvas>
    </div>

    <!-- Hidden 80x80 canvas for model input resizing -->
    <canvas id="hiddenCanvas" width="80" height="80" style="display: none;"></canvas>

    <div class="controls-bar">
      <button id="startBtn" disabled>▶ Start Camera</button>
      <button id="stopBtn" class="btn-danger" style="display: none;">⏹ Stop Camera</button>

      <select id="cameraSelect" title="Select Video Device">
        <option value="">Default Camera / Microscope</option>
      </select>

      <label class="file-btn" style="cursor: pointer;">
        📁 Upload Image
        <input type="file" id="fileInput" accept="image/*" style="display: none;">
      </label>
    </div>
  </section>

  <!-- Classification Output -->
  <section class="card">
    <div class="banner-result" id="banner">
      <span class="badge-status" id="badgeStatus">INITIALIZING</span>
      <div class="prediction-title" id="predLabel">Loading Neural Network...</div>
      <div class="confidence-tag" id="predConf">0.0%</div>
    </div>

    <h3 style="font-size: 1rem; margin-bottom: 0.75rem;">Class Probability Breakdown</h3>
    <div class="scores-list" id="scoresContainer"></div>

    <div class="legend-box">
      <strong>Operational Rules:</strong>
      <div class="legend-item">
        <span class="dot dot-red"></span>
        <span><b>RED / TARGET</b>: <em>P. aeruginosa, S. aureus</em></span>
      </div>
      <div class="legend-item">
        <span class="dot dot-green"></span>
        <span><b>GREEN / COMPARATOR</b>: <em>L. delbrueckii, Micrococcus, Candida</em></span>
      </div>
    </div>
  </section>
</main>

<script>
  const LABELS = [
    "Pseudomonas_aeruginosa",
    "Staphylococcus_aureus",
    "Lactobacillus_delbrueckii",
    "Micrococcus_spp",
    "Candida_albicans"
  ];
  const TARGETS = new Set(["Pseudomonas_aeruginosa", "Staphylococcus_aureus"]);

  const video = document.getElementById('webcam');
  const canvas = document.getElementById('capturedCanvas');
  const hiddenCanvas = document.getElementById('hiddenCanvas');
  const hCtx = hiddenCanvas.getContext('2d', { willReadFrequently: true });
  const videoBox = document.getElementById('videoBox');
  const startBtn = document.getElementById('startBtn');
  const stopBtn = document.getElementById('stopBtn');
  const cameraSelect = document.getElementById('cameraSelect');
  const fileInput = document.getElementById('fileInput');
  const banner = document.getElementById('banner');
  const badgeStatus = document.getElementById('badgeStatus');
  const predLabel = document.getElementById('predLabel');
  const predConf = document.getElementById('predConf');
  const engineStatus = document.getElementById('engineStatus');
  const scoresContainer = document.getElementById('scoresContainer');

  let session = null;
  let stream = null;
  let animFrameId = null;
  let isPredicting = false;
  let lastInferenceTime = 0;

  // Build probability rows
  LABELS.forEach((label, idx) => {
    const isTarget = TARGETS.has(label);
    const row = document.createElement('div');
    row.className = 'score-row';
    row.innerHTML = `
      <div class="score-labels">
        <span>${label}</span>
        <span id="score-val-${idx}">0.0%</span>
      </div>
      <div class="progress-bar-bg">
        <div class="progress-bar-fill ${isTarget ? 'target' : ''}" id="score-bar-${idx}" style="width: 0%;"></div>
      </div>
    `;
    scoresContainer.appendChild(row);
  });

  // Initialize ONNX Runtime Web Model
  async function initModel() {
    try {
      engineStatus.textContent = 'Loading ONNX Model...';
      
      // Point WASM assets to local directory for reliable, zero-latency loading
      if (typeof ort !== 'undefined' && ort.env && ort.env.wasm) {
        ort.env.wasm.wasmPaths = './';
        ort.env.wasm.numThreads = 1;
      }

      // Fetch model arraybuffer
      const resp = await fetch('./bacteria_classifier.onnx?v=' + Date.now());
      if (!resp.ok) {
        throw new Error('HTTP ' + resp.status + ' loading bacteria_classifier.onnx');
      }
      const modelBuffer = await resp.arrayBuffer();

      // Create inference session
      session = await ort.InferenceSession.create(modelBuffer, {
        executionProviders: ['wasm']
      });

      engineStatus.textContent = 'AI Ready: Edge WASM Engine';
      badgeStatus.textContent = 'READY';
      predLabel.textContent = 'Ready - Click Start Camera';
      startBtn.disabled = false;
      await loadCameras();
    } catch (err) {
      console.error("Initialization error:", err);
      engineStatus.textContent = 'Load error: ' + (err.message || err);
      badgeStatus.textContent = 'ERROR';
      predLabel.textContent = err.message || 'Model Load Error';
    }
  }

  async function loadCameras() {
    try {
      const devices = await navigator.mediaDevices.enumerateDevices();
      const videoDevices = devices.filter(d => d.kind === 'videoinput');
      cameraSelect.innerHTML = '';
      videoDevices.forEach((dev, i) => {
        const opt = document.createElement('option');
        opt.value = dev.deviceId;
        opt.text = dev.label || `Camera ${i + 1}`;
        cameraSelect.appendChild(opt);
      });
    } catch (e) {
      console.warn("Camera enum error:", e);
    }
  }

  startBtn.addEventListener('click', async () => {
    try {
      const constraints = {
        video: cameraSelect.value ? { deviceId: { exact: cameraSelect.value } } : true
      };
      stream = await navigator.mediaDevices.getUserMedia(constraints);
      video.srcObject = stream;
      video.style.display = 'block';
      canvas.style.display = 'none';

      startBtn.style.display = 'none';
      stopBtn.style.display = 'inline-flex';
      engineStatus.textContent = 'Live Inference: Active';

      await loadCameras();
      loopInference();
    } catch (err) {
      alert("Unable to access camera: " + err.message);
    }
  });

  stopBtn.addEventListener('click', () => {
    if (stream) {
      stream.getTracks().forEach(t => t.stop());
    }
    if (animFrameId) {
      cancelAnimationFrame(animFrameId);
    }
    video.srcObject = null;
    startBtn.style.display = 'inline-flex';
    stopBtn.style.display = 'none';
    engineStatus.textContent = 'Camera Stopped';
  });

  function loopInference() {
    const now = performance.now();
    // Run at ~8-10 FPS for optimal responsiveness and low CPU usage
    if (now - lastInferenceTime > 110) {
      if (!isPredicting && video.videoWidth > 0) {
        runInferenceFromSource(video);
        lastInferenceTime = now;
      }
    }
    animFrameId = requestAnimationFrame(loopInference);
  }

  async function runInferenceFromSource(sourceElement) {
    if (!session || isPredicting) return;
    isPredicting = true;

    try {
      // 1. Draw frame into 80x80 hidden canvas
      hCtx.drawImage(sourceElement, 0, 0, 80, 80);
      const imgData = hCtx.getImageData(0, 0, 80, 80).data;

      // 2. Preprocess into [1, 3, 80, 80] tensor normalized to [-1, 1]
      const floatData = new Float32Array(3 * 80 * 80);
      for (let y = 0; y < 80; y++) {
        for (let x = 0; x < 80; x++) {
          const idx = (y * 80 + x) * 4;
          const r = (imgData[idx] / 255.0 - 0.5) / 0.5;
          const g = (imgData[idx + 1] / 255.0 - 0.5) / 0.5;
          const b = (imgData[idx + 2] / 255.0 - 0.5) / 0.5;
          
          floatData[0 * 6400 + y * 80 + x] = r;
          floatData[1 * 6400 + y * 80 + x] = g;
          floatData[2 * 6400 + y * 80 + x] = b;
        }
      }

      const inputTensor = new ort.Tensor('float32', floatData, [1, 3, 80, 80]);
      const results = await session.run({ input: inputTensor });
      const logits = results.output.data;

      // Softmax
      let maxLogit = -Infinity;
      for (let i = 0; i < logits.length; i++) {
        if (logits[i] > maxLogit) maxLogit = logits[i];
      }

      let expSum = 0;
      const exps = new Float32Array(logits.length);
      for (let i = 0; i < logits.length; i++) {
        exps[i] = Math.exp(logits[i] - maxLogit);
        expSum += exps[i];
      }

      const probs = [];
      let maxProb = -1;
      let topIdx = 0;
      for (let i = 0; i < logits.length; i++) {
        const p = (exps[i] / expSum) * 100;
        probs.push(p);
        if (p > maxProb) {
          maxProb = p;
          topIdx = i;
        }
      }

      updateUI(topIdx, maxProb, probs);
    } catch (err) {
      console.error("Inference error:", err);
    } finally {
      isPredicting = false;
    }
  }

  function updateUI(topIdx, confidence, probs) {
    const label = LABELS[topIdx];
    const isTarget = TARGETS.has(label);

    predLabel.textContent = label;
    predConf.textContent = confidence.toFixed(1) + '%';
    badgeStatus.textContent = isTarget ? 'TARGET / ALERT' : 'NEGATIVE / COMPARATOR';

    videoBox.className = 'video-container ' + (isTarget ? 'status-red' : 'status-green');
    banner.className = 'banner-result ' + (isTarget ? 'alert-red' : 'alert-green');

    probs.forEach((p, i) => {
      const valEl = document.getElementById(`score-val-${i}`);
      const barEl = document.getElementById(`score-bar-${i}`);
      if (valEl) valEl.textContent = p.toFixed(1) + '%';
      if (barEl) barEl.style.width = Math.min(100, Math.max(0, p)) + '%';
    });
  }

  fileInput.addEventListener('change', (e) => {
    const file = e.target.files[0];
    if (!file) return;

    if (stream) {
      stopBtn.click();
    }

    const reader = new FileReader();
    reader.onload = (evt) => {
      const img = new Image();
      img.onload = () => {
        canvas.width = img.width;
        canvas.height = img.height;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0);

        video.style.display = 'none';
        canvas.style.display = 'block';

        runInferenceFromSource(img);
        engineStatus.textContent = 'Image Inference Complete';
      };
      img.src = evt.target.result;
    };
    reader.readAsDataURL(file);
  });

  // Start initialization
  initModel();
</script>
</body>
</html>
